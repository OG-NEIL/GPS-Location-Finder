<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Geocoding</title>
</head>

<body>

    <h2>Convert Coordinates to Address</h2>

    <form id="locationForm">

        <label for="latitude">Latitude:</label>
        <input
            type="number"
            id="latitude"
            step="any"
            placeholder="e.g. 6.5244"
            required
        >

        <br><br>

        <label for="longitude">Longitude:</label>
        <input
            type="number"
            id="longitude"
            step="any"
            placeholder="e.g. 3.3792"
            required
        >

        <br><br>

        <button type="submit">Get Address</button>

    </form>

    <h3>Result:</h3>
    <p id="result">Enter coordinates and click "Get Address".</p>


    <script>

        const form = document.getElementById("locationForm");
        const result = document.getElementById("result");

        form.addEventListener("submit", async (event) => {

            event.preventDefault();

            const latitude = document.getElementById("latitude").value;
            const longitude = document.getElementById("longitude").value;

            result.textContent = "Finding address...";

            try {

                const url =
                    `https://nominatim.openstreetmap.org/reverse` +
                    `?format=json` +
                    `&lat=${latitude}` +
                    `&lon=${longitude}`;

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("Failed to retrieve address");
                }

                const data = await response.json();

                result.textContent = data.display_name;

            } catch (error) {

                console.error(error);

                result.textContent =
                    "Unable to find an address for these coordinates.";

            }

        });

    </script>

</body>
</html>

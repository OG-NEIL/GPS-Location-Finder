
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reverse Geocoding</title>
</head>

<body>

    <h2>Find Address</h2>

    <form id="locationForm">

        <label>Latitude:</label>

        <input
            type="number"
            id="latitude"
            step="any"
            placeholder="6.5244"
            required
        >

        <br><br>

        <label>Longitude:</label>

        <input
            type="number"
            id="longitude"
            step="any"
            placeholder="3.3792"
            required
        >

        <br><br>

        <button type="submit">
            Find Address
        </button>

    </form>

    <h3>Address:</h3>

    <p id="result">
        Enter coordinates above.
    </p>


    <script>

        const form = document.getElementById("locationForm");

        const result = document.getElementById("result");


        form.addEventListener("submit", async (event) => {

            event.preventDefault();


            const latitude =
                document.getElementById("latitude").value;

            const longitude =
                document.getElementById("longitude").value;


            result.textContent = "Finding address...";


            try {

                const response = await fetch(
                    "/api/reverse-geocode",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            latitude: latitude,
                            longitude: longitude
                        })
                    }
                );


                const data = await response.json();


                if (!response.ok) {
                    throw new Error(data.error);
                }


                result.textContent = data.address;


            } catch (error) {

                console.error(error);

                result.textContent =
                    "Error: " + error.message;

            }

        });

    </script>

</body>

</html>
